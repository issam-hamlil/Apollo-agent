# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Ollama auth reverse proxy
#
# Local dev:  docker run --network host -v ./nginx:/etc/nginx/conf.d:ro nginx
# OCI prod:   same config, replace proxy_pass host with 127.0.0.1:11434
#
# Auth: every request must carry the X-Api-Key header matching NGINX_API_KEY.
# Requests without the header, or with a wrong value, receive HTTP 401.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # Map: header present & correct → "ok", anything else → "fail"
    map $http_x_api_key $api_key_check {
        default        "fail";
        # Replace the value below with: openssl rand -hex 32
        "REPLACE_WITH_YOUR_TOKEN" "ok";
    }

    server {
        listen 80;
        server_name _;

        # ── Ollama proxy (all paths) ────────────────────────────────────────
        location / {
            # Reject missing or wrong key
            if ($api_key_check = "fail") {
                return 401 "Unauthorized: missing or invalid X-Api-Key header\n";
            }

            proxy_pass         http://localhost:11434;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Required for streaming inference responses
            proxy_buffering    off;
        }
    }
}
